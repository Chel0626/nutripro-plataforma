version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nutripro_nutrition
      POSTGRES_USER: nutripro
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutripro -d nutripro_nutrition"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Nutrition Service (FastAPI)
  nutrition-service:
    build: ./services/nutrition-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://nutripro:password@postgres/nutripro_nutrition
      REDIS_URL: redis://redis:6379
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/nutrition-service:/app
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NUTRITION_API_URL: http://nutrition-service:8001/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    depends_on:
      - nutrition-service
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # API Gateway (Nginx) - opcional
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - nutrition-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: