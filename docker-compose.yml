version: '3.8'

services:
  nutripro:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./.env.production:/app/.env
    restart: unless-stopped
    
